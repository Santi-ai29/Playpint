<!doctype html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Playpint - Stop</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell" aria-live="polite">
      <section class="phone-screen">
        <div class="ambient ambient-sheet"></div>
        <div class="ambient ambient-pencil"></div>

        <header class="topbar">
          <div class="brand-block">
            <img class="brand-logo" src="./assets/playpint-logo.png" alt="Playpint" />
            <p class="mode">Stop</p>
          </div>
          <div class="round-pill">
            <span id="phaseLabel">Mesa</span>
            <strong id="timerLabel">90s</strong>
          </div>
        </header>

        <section id="introPanel" class="intro-panel">
          <div class="intro-mark" aria-hidden="true">
            <span></span>
            <strong>Stop</strong>
            <i></i>
          </div>
        </section>

        <section id="roulettePanel" class="roulette-panel hidden">
          <div class="roulette-copy">
            <p class="eyebrow">Roleta Stop</p>
            <h2>Sorteio da letra</h2>
          </div>
          <div class="roulette-machine" aria-label="Roleta de letras">
            <div class="slot-shell">
              <div id="roulettePrevious" class="roulette-ghost top">A</div>
              <div id="rouletteSpotlight" class="roulette-spotlight">A</div>
              <div id="rouletteNext" class="roulette-ghost bottom">B</div>
            </div>
          </div>
        </section>

        <section id="countdownPanel" class="countdown-panel hidden" aria-label="Contagem">
          <div class="countdown-core">
            <span></span>
            <strong id="countdownNumber">3</strong>
          </div>
        </section>

        <section id="roundPanel" class="round-panel hidden">
          <div class="letter-stage">
            <span>Letra</span>
            <strong id="roundLetter">A</strong>
            <em id="submissionCount">0/4</em>
          </div>
          <form id="answersForm" class="answers-form"></form>
        </section>

        <section id="resultPanel" class="result-panel hidden">
          <div class="review-hero">
            <span id="reviewLetterLabel">Letra A</span>
            <strong id="reviewTitle">Rever respostas</strong>
            <em id="reviewSubtitle">Ana carregou Stop</em>
          </div>
          <div id="reviewTabs" class="review-tabs"></div>
          <div id="reviewBoard" class="review-board"></div>
        </section>

        <section id="scorePanel" class="score-panel hidden">
          <div class="score-hero">
            <span id="scoreLetterLabel">Letra A</span>
            <strong id="scoreWinner">Bruno venceu</strong>
            <em id="scoreSubtitle">Pontos acumulados</em>
          </div>
          <div id="roundScores" class="round-scores"></div>
          <div id="rankingList" class="ranking-list"></div>
        </section>

        <footer class="game-footer">
          <button id="primaryAction" class="primary-action" type="button">Comecar jogo</button>
        </footer>
      </section>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
