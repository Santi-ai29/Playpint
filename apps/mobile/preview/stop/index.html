<!doctype html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Playpint - Stop</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell" aria-live="polite">
      <section class="phone-screen">
        <header class="topbar">
          <div class="brand-block">
            <img class="brand-logo" src="./assets/playpint-logo.png" alt="Playpint" />
          </div>
          <div class="round-pill">
            <span id="phaseLabel">Mesa</span>
            <strong id="timerLabel">90s</strong>
          </div>
        </header>

        <section id="introPanel" class="intro-panel">
          <div class="intro-background" aria-hidden="true">
            <span class="intro-lines"></span>
            <span class="intro-arc intro-arc-top"></span>
            <span class="intro-arc intro-arc-bottom"></span>
            <span class="intro-arc intro-arc-center"></span>
            <span class="intro-p-mark intro-p-mark-top">P</span>
            <span class="intro-p-mark intro-p-mark-bottom">P</span>
            <span class="intro-dots intro-dots-left"></span>
            <span class="intro-dots intro-dots-right"></span>
            <span class="intro-speedline speedline-1"></span>
            <span class="intro-speedline speedline-2"></span>
            <span class="intro-speedline speedline-3"></span>
            <span class="intro-speedline speedline-4"></span>
            <span class="intro-speedline speedline-5"></span>
            <span class="intro-speedline speedline-6"></span>
          </div>
          <div class="intro-stop-logo" aria-hidden="true">
            <strong class="stop-symbol">STOP</strong>
            <span class="stop-symbol-line"></span>
            <div class="intro-hand-lockup">
              <span></span>
              <div class="intro-hand-badge">
                <svg viewBox="0 0 32 32" focusable="false" aria-hidden="true">
                  <path d="M10.4 15.7v-5.1a1.7 1.7 0 0 1 3.4 0v5.1" />
                  <path d="M13.8 15.3V8.8a1.7 1.7 0 0 1 3.4 0v6.5" />
                  <path d="M17.2 15.7v-5.5a1.7 1.7 0 0 1 3.4 0v6.3" />
                  <path d="M20.6 17.1v-3.4a1.7 1.7 0 0 1 3.4 0v6.2c0 5.1-3.4 8.1-7.7 8.1h-1.1c-3.1 0-5.1-1.5-6.8-4.1l-2.3-3.5a1.8 1.8 0 0 1 2.8-2.2l2.1 2.3" />
                </svg>
              </div>
              <span></span>
            </div>
          </div>
        </section>

        <section id="settingsPanel" class="setup-panel settings-panel hidden" aria-label="Definicoes admin">
          <div class="settings-status">
            <strong id="settingsSummary">6 temas</strong>
          </div>

          <div class="settings-quick">
            <div class="setting-counter">
              <span>Rondas</span>
              <div id="roundOptions" class="option-row"></div>
            </div>
            <div class="setting-counter">
              <span>Tempo</span>
              <div id="timeOptions" class="option-row"></div>
            </div>
          </div>

          <div class="categories-setup">
            <div class="section-head">
              <span>Temas</span>
              <button id="resetCategories" class="tiny-action" type="button">Reset</button>
            </div>
            <div id="categoryToggles" class="category-toggles"></div>
            <form id="addCategoryForm" class="add-player-form category-add-form">
              <input id="categoryInput" type="text" maxlength="18" autocomplete="off" placeholder="Novo tema" />
              <button type="submit">Add</button>
            </form>
          </div>

          <div class="letters-setup">
            <div class="section-head">
              <span>Letras</span>
              <small id="lettersSummary">18</small>
            </div>
            <div id="letterToggles" class="letter-toggles"></div>
          </div>
        </section>

        <section id="roulettePanel" class="roulette-panel hidden" aria-label="Sorteio da letra">
          <div class="roulette-machine" aria-label="Roleta de letras">
            <span class="roulette-pointer" aria-hidden="true"></span>
            <div id="rouletteWheel" class="roulette-wheel" aria-hidden="true"></div>
            <div class="roulette-center">
              <img class="roulette-center-logo" src="./assets/playpint-logo.png" alt="" />
              <strong id="rouletteSpotlight" class="roulette-spotlight" aria-hidden="true">A</strong>
            </div>
          </div>
          <p id="rouletteLive" class="sr-only" aria-live="polite"></p>
        </section>

        <section id="countdownPanel" class="countdown-panel hidden" aria-label="Contagem">
          <div class="countdown-header countdown-animate">
            <span>Ronda a comecar</span>
            <strong>Prepara-te!</strong>
          </div>

          <div class="countdown-core countdown-animate">
            <span class="countdown-speedline speedline-a" aria-hidden="true"></span>
            <span class="countdown-speedline speedline-b" aria-hidden="true"></span>

            <div class="countdown-ticks" aria-hidden="true">
              <i style="--tick-index: 0"></i><i style="--tick-index: 1"></i>
              <i style="--tick-index: 2"></i><i style="--tick-index: 3"></i>
              <i style="--tick-index: 4"></i><i style="--tick-index: 5"></i>
              <i style="--tick-index: 6"></i><i style="--tick-index: 7"></i>
              <i style="--tick-index: 8"></i><i style="--tick-index: 9"></i>
              <i style="--tick-index: 10"></i><i style="--tick-index: 11"></i>
              <i style="--tick-index: 12"></i><i style="--tick-index: 13"></i>
              <i style="--tick-index: 14"></i><i style="--tick-index: 15"></i>
            </div>

            <svg class="countdown-progress-ring" viewBox="0 0 320 320" aria-hidden="true">
              <defs>
                <linearGradient id="countdownProgressGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#FFC13D"></stop>
                  <stop offset="100%" stop-color="#FF4A0A"></stop>
                </linearGradient>
              </defs>
              <circle class="progress-track" cx="160" cy="160" r="142"></circle>
              <circle class="progress-value" cx="160" cy="160" r="142" pathLength="1"></circle>
            </svg>

            <div class="countdown-burst" aria-hidden="true">
              <i style="--burst-index: 0"></i><i style="--burst-index: 1"></i>
              <i style="--burst-index: 2"></i><i style="--burst-index: 3"></i>
              <i style="--burst-index: 4"></i><i style="--burst-index: 5"></i>
              <i style="--burst-index: 6"></i><i style="--burst-index: 7"></i>
              <i style="--burst-index: 8"></i><i style="--burst-index: 9"></i>
            </div>

            <div class="countdown-particles" aria-hidden="true">
              <i style="--particle-index: 0"></i><i style="--particle-index: 1"></i>
              <i style="--particle-index: 2"></i><i style="--particle-index: 3"></i>
              <i style="--particle-index: 4"></i><i style="--particle-index: 5"></i>
              <i style="--particle-index: 6"></i><i style="--particle-index: 7"></i>
            </div>

            <div class="countdown-disc">
              <strong id="countdownNumber" aria-live="assertive">3</strong>
            </div>
          </div>

          <div class="countdown-bottom countdown-animate">
            <p>Pensa rapido. Escreve ainda mais rapido.</p>
            <div id="countdownProgress" class="countdown-progress" aria-hidden="true">
              <span></span><span></span><span></span><span></span>
            </div>
          </div>
        </section>

        <section id="roundPanel" class="round-panel hidden">
          <div class="letter-stage">
            <span>Letra</span>
            <strong id="roundLetter">A</strong>
            <em id="submissionCount">0/4</em>
          </div>
          <form id="answersForm" class="answers-form"></form>
        </section>

        <section id="resultPanel" class="result-panel hidden">
          <div class="review-hero">
            <span id="reviewLetterLabel">Letra A</span>
            <strong id="reviewTitle">Rever respostas</strong>
            <em id="reviewSubtitle">Ana carregou Stop</em>
          </div>
          <div id="reviewBoard" class="review-board"></div>
        </section>

        <section id="scorePanel" class="score-panel hidden">
          <div class="score-hero">
            <span id="scoreLetterLabel">Letra A</span>
            <strong id="scoreWinner">Bruno venceu</strong>
            <em id="scoreSubtitle">Pontos acumulados</em>
          </div>
          <div id="roundScores" class="round-scores"></div>
        </section>

        <footer class="game-footer">
          <button id="primaryAction" class="primary-action" type="button">Comecar jogo</button>
        </footer>
      </section>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
