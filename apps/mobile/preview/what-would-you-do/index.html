<!doctype html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Playpint - O Que Fazias?</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell" aria-live="polite">
      <section class="phone-screen">
        <header class="topbar">
          <div class="brand-block">
            <img class="brand-logo mode-logo-top" src="./assets/what-fazias-logo.png" alt="O Que Fazias?" />
          </div>
          <div class="round-pill">
            <span id="phaseLabel">Pergunta 1</span>
            <strong id="timerLabel">00:20</strong>
          </div>
        </header>

        <section id="introPanel" class="intro-panel">
          <header class="intro-header">
            <img class="intro-playpint-logo" src="./assets/playpint-logo.png" alt="Playpint" />
            <span class="intro-kicker">Jogo de escolhas</span>
          </header>
          <div class="intro-main">
            <div class="intro-brand-lockup">
              <div class="intro-logo-wrap">
                <img class="intro-logo" src="./assets/what-fazias-logo.png" alt="O Que Fazias?" />
              </div>
              <p class="intro-tagline">Duas opções. Uma escolha.</p>
            </div>
            <div class="choice-arena" aria-hidden="true">
              <div class="choice-card choice-card-a">
                <span>Opção</span>
                <strong>A</strong>
              </div>
              <div class="choice-versus">
                <span>OU</span>
              </div>
              <div class="choice-card choice-card-b">
                <span>Opção</span>
                <strong>B</strong>
              </div>
            </div>
          </div>
        </section>

        <section id="questionPanel" class="question-panel">
          <p class="eyebrow" id="eyebrow">Aguardando pergunta</p>
          <h1 id="prompt">Se um tubarao aparecesse a tua frente, o que fazias?</h1>
        </section>

        <section id="optionsPanel" class="options-panel" aria-label="Opcoes de voto"></section>

        <section id="statusPanel" class="status-panel hidden">
          <div class="status-check">OK</div>
          <strong>Voto enviado</strong>
          <span id="voteCountLabel">A espera da mesa</span>
        </section>

        <section id="resultPanel" class="result-panel hidden">
          <p class="result-title">A mesa decidiu</p>
          <div class="winner-card">
            <div>
              <h2 id="winnerName">Fugia</h2>
              <p id="winnerLabel">opcao mais escolhida</p>
            </div>
            <strong id="winnerPercentage">66.7%</strong>
          </div>
          <p class="result-message" id="resultMessage">A mesa falou.</p>
          <div class="result-bars" id="resultBars"></div>
        </section>

        <footer class="game-footer">
          <button id="primaryAction" class="primary-action" type="button">Abrir votacao</button>
        </footer>
      </section>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
